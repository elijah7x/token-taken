name: TokenTaken
options:
  bundleIdPrefix: io.github.elijah7x
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
    ENABLE_HARDENED_RUNTIME: "YES"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  TokenTakenKit:
    type: framework
    platform: macOS
    sources: [TokenTakenKit]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.elijah7x.TokenTakenKit
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
  TokenTaken:
    type: application
    platform: macOS
    sources: [TokenTaken]
    dependencies:
      - target: TokenTakenKit
        embed: true
      - target: TokenTakenCLI
        embed: false
        link: false
    postBuildScripts:
      - name: Bundle helper tools
        shell: /bin/bash
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          helpers="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          resources="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$helpers" "$resources" "${DERIVED_FILE_DIR}"
          # Hardened runtime enables library validation, which rejects ad-hoc frameworks; use it only with a real identity.
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          identity_key="$(printf '%s' "$identity" | shasum -a 256 | awk '{print $1}')"
          # The current-identity key ensures switching back to a previous configuration also re-signs.
          bundle_tool() {
            local source="$1" name="$2" entitlements="${3:-}"
            local target="$helpers/$name" stamp="${DERIVED_FILE_DIR}/helper-$name.source"
            local key="${DERIVED_FILE_DIR}/helper-$name.key" signed_key=""
            if [[ -f "$key" ]]; then signed_key="$(cat "$key")"; fi
            if [[ -f "$target" && -f "$stamp" && "$signed_key" == "$identity_key" ]] && cmp -s "$source" "$stamp"; then return; fi
            cp "$source" "$target"; chmod 755 "$target"
            if [[ "$identity" == "-" ]]; then
              if [[ -n "$entitlements" ]]; then
                codesign --force --timestamp=none --entitlements "$entitlements" --sign "$identity" "$target"
              else
                codesign --force --timestamp=none --sign "$identity" "$target"
              fi
            elif [[ -n "$entitlements" ]]; then
              codesign --force --options runtime --timestamp --entitlements "$entitlements" --sign "$identity" "$target"
            else
              codesign --force --options runtime --timestamp --sign "$identity" "$target"
            fi
            cp "$source" "$stamp"
            printf '%s\n' "$identity_key" > "$key"
          }
          bundle_tool "${BUILT_PRODUCTS_DIR}/token-taken" token-taken "${SRCROOT}/TokenTakenCLI/TokenTakenCLI.entitlements"
          if [[ -f "${SRCROOT}/Vendor/engine/tokscale" ]]; then bundle_tool "${SRCROOT}/Vendor/engine/tokscale" tokscale; fi
          cmp -s "${SRCROOT}/engine/engine.lock.json" "$resources/engine.lock.json" || cp "${SRCROOT}/engine/engine.lock.json" "$resources/engine.lock.json"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.elijah7x.TokenTaken
        PRODUCT_NAME: Token Taken
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Token Taken
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_ENTITLEMENTS: TokenTaken/TokenTaken.entitlements
        SWIFT_EMIT_LOC_STRINGS: "YES"
        LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
  TokenTakenCLI:
    type: tool
    platform: macOS
    sources: [TokenTakenCLI]
    dependencies:
      - target: TokenTakenKit
    settings:
      base:
        PRODUCT_NAME: token-taken
        PRODUCT_BUNDLE_IDENTIFIER: io.github.elijah7x.TokenTaken.CLI
        CODE_SIGN_ENTITLEMENTS: TokenTakenCLI/TokenTakenCLI.entitlements
        # A command-line tool cannot embed the framework; find it beside the tool or in an app bundle.
        LD_RUNPATH_SEARCH_PATHS: "@executable_path @executable_path/../Frameworks @loader_path/../Frameworks"
  TokenTakenKitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenTakenKitTests
        excludes: ["Fixtures/**"]
      - path: TokenTakenKitTests/Fixtures
        optional: true
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.elijah7x.TokenTakenKitTests
    dependencies:
      - target: TokenTakenKit
schemes:
  TokenTaken:
    build:
      targets:
        TokenTaken: all
    test:
      targets: [TokenTakenKitTests]
  token-taken:
    build:
      targets:
        TokenTakenCLI: all
    run:
      executable: TokenTakenCLI
      commandLineArguments:
        "summary": true
